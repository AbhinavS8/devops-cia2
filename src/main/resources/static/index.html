
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Task Tracker</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #202938;
        }

        header {
            background: #17243a;
            color: white;
            padding: 24px 7%;
        }

        header h2 { margin: 0; }
        header p { color: #b7c5d8; margin-bottom: 0; }

        main {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0000000a;
            margin-bottom: 20px;
        }

        .card p { color: #687386; margin: 0; }
        .card h1 { font-size: 32px; margin: 10px 0 0; }

        .add-form {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #d5dbe5;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .task-title {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .task-title.done {
            text-decoration: line-through;
            color: #929baa;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
        }

        .task input[type="checkbox"] {
            flex: none;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .health {
            color: #16834a;
            font-size: 14px;
        }

        #message {
            margin-top: 12px;
            color: #b91c1c;
            font-size: 14px;
        }

        footer {
            color: #687386;
            font-size: 13px;
            margin-top: 30px;
        }

        @media (max-width: 550px) {
            .cards { grid-template-columns: 1fr; }
            .add-form { flex-direction: column; }
        }
    </style>
</head>

<body>
<header>
    <h2>DevOps Task Tracker</h2>
    <p>CI/CD Assignment - Task Management Dashboard</p>
</header>

<main>
    <h2>Overview</h2>

    <section class="cards">
        <div class="card">
            <p>Total Tasks</p>
            <h1 id="total">0</h1>
        </div>

        <div class="card">
            <p>Completed Tasks</p>
            <h1 id="completed">0</h1>
        </div>
    </section>

    <section class="card">
        <h3>Add a new task</h3>

        <form id="addForm" class="add-form">
            <input
                id="taskInput"
                type="text"
                placeholder="Enter task description..."
                maxlength="200"
                required
            >
            <button class="add-btn" type="submit">Add Task</button>
        </form>

        <div id="message"></div>
    </section>

    <section class="card">
        <h3>Your Tasks</h3>
        <div id="tasks">Loading tasks...</div>
    </section>

    <section class="card">
        <strong>Application Health:</strong>
        <span class="health" id="health">Checking...</span>
        <p id="version"></p>
    </section>

    <footer>
        DevOps CIA 2 | Spring Boot + Docker + Kubernetes
    </footer>
</main>

<script>
    const tasksContainer = document.getElementById('tasks');
    const message = document.getElementById('message');

    async function apiRequest(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            headers: {
                'Content-Type': 'application/json',
                ...options.headers
            }
        });

        if (!response.ok) {
            throw new Error(`Request failed: ${response.status}`);
        }

        if (response.status === 204) return null;

        return response.json();
    }

    async function loadTasks() {
        const tasks = await apiRequest('/api/tasks');

        const completed = tasks.filter(
            task => task.completed
        ).length;

        document.getElementById('total').textContent = tasks.length;
        document.getElementById('completed').textContent = completed;

        tasksContainer.replaceChildren();

        if (tasks.length === 0) {
            tasksContainer.textContent = 'No tasks yet. Add one above!';
            return;
        }

        tasks.forEach(task => {
            const row = document.createElement('div');
            row.className = 'task';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = task.completed;
            checkbox.setAttribute('aria-label', 'Complete task');

            checkbox.addEventListener('change', async () => {
                try {
                    await apiRequest(`/api/tasks/${task.id}`, {
                        method: 'PATCH',
                        body: JSON.stringify({
                            completed: checkbox.checked
                        })
                    });

                    await loadTasks();
                } catch (error) {
                    showMessage(error.message);
                    await loadTasks();
                }
            });

            const title = document.createElement('span');
            title.className = 'task-title';

            if (task.completed) {
                title.classList.add('done');
            }

            title.textContent = task.title;

            const deleteButton = document.createElement('button');
            deleteButton.className = 'delete-btn';
            deleteButton.textContent = 'Delete';

            deleteButton.addEventListener('click', async () => {
                try {
                    await apiRequest(`/api/tasks/${task.id}`, {
                        method: 'DELETE'
                    });

                    await loadTasks();
                } catch (error) {
                    showMessage(error.message);
                }
            });

            row.append(checkbox, title, deleteButton);
            tasksContainer.appendChild(row);
        });
    }

    document.getElementById('addForm').addEventListener(
        'submit', async event => {
            event.preventDefault();

            const input = document.getElementById('taskInput');
            const title = input.value.trim();

            if (!title) return;

            try {
                await apiRequest('/api/tasks', {
                    method: 'POST',
                    body: JSON.stringify({ title })
                });

                input.value = '';
                showMessage('');
                await loadTasks();
            } catch (error) {
                showMessage(error.message);
            }
        }
    );

    function showMessage(text) {
        message.textContent = text;
    }

    async function loadSystemStatus() {
        try {
            const [health, info] = await Promise.all([
                apiRequest('/health'),
                apiRequest('/api/info')
            ]);

            document.getElementById('health').textContent =
                health.status;

            document.getElementById('version').textContent =
                `Application version: ${info.version}`;
        } catch {
            document.getElementById('health').textContent =
                'Unavailable';
        }
    }

    async function initialize() {
        try {
            await loadTasks();
        } catch (error) {
            showMessage(error.message);
        }

        await loadSystemStatus();
    }

    initialize();
</script>
</body>
</html>
