
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Task Tracker</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #202938;
        }

        header {
            background: #17243a;
            color: white;
            padding: 22px 7%;
        }

        header h2 {
            margin: 0;
        }

        header p {
            color: #b7c5d8;
            margin-bottom: 0;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0000000a;
        }

        .card p {
            color: #687386;
            margin: 0;
        }

        .card h1 {
            font-size: 32px;
            margin-bottom: 0;
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
            gap: 12px;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            background: #e6f7ed;
            color: #16834a;
        }

        .pending {
            background: #fff3d6;
            color: #9b6a00;
        }

        .health {
            margin-top: 20px;
            color: #16834a;
        }

        footer {
            color: #687386;
            font-size: 13px;
            margin-top: 30px;
        }

        @media (max-width: 550px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h2>DevOps Task Tracker</h2>
    <p>CI/CD Assignment - Application Dashboard</p>
</header>

<main>
    <h2>Overview</h2>

    <section class="cards">
        <div class="card">
            <p>Total Tasks</p>
            <h1 id="total">-</h1>
        </div>

        <div class="card">
            <p>Completed Tasks</p>
            <h1 id="completed">-</h1>
        </div>
    </section>

    <section class="card">
        <h3>Tasks</h3>
        <div id="tasks">Loading tasks...</div>
    </section>

    <section class="card health">
        <strong>Application Health:</strong>
        <span id="health">Checking...</span>
        <p id="version"></p>
    </section>

    <footer>
        DevOps CIA 2 | Spring Boot + Docker + Kubernetes
    </footer>
</main>

<script>
    async function loadDashboard() {
        try {
            const [tasksResponse, healthResponse, infoResponse] =
                await Promise.all([
                    fetch('/api/tasks'),
                    fetch('/health'),
                    fetch('/api/info')
                ]);

            if (!tasksResponse.ok || !healthResponse.ok ||
                !infoResponse.ok) {
                throw new Error("API request failed");
            }

            const tasks = await tasksResponse.json();
            const health = await healthResponse.json();
            const info = await infoResponse.json();

            const completed = tasks.filter(
                task => task.completed
            ).length;

            document.getElementById('total').textContent =
                tasks.length;

            document.getElementById('completed').textContent =
                completed;

            document.getElementById('tasks').innerHTML =
                tasks.map(task => `
                    <div class="task">
                        <span>${task.title}</span>
                        <span class="status ${
                            task.completed ? '' : 'pending'
                        }">
                            ${task.completed ? 'Completed' : 'Pending'}
                        </span>
                    </div>
                `).join('');

            document.getElementById('health').textContent =
                health.status;

            document.getElementById('version').textContent =
                `Version: ${info.version}`;

        } catch (error) {
            document.getElementById('health').textContent =
                'Unavailable';
            document.getElementById('tasks').textContent =
                'Unable to load tasks. Check the backend.';
        }
    }

    loadDashboard();
</script>

</body>
</html>
